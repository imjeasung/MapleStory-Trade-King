<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강화학습 레벨업 조언자</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #555;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result-container {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
        }
        .up {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        .stop {
            background-color: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 레벨업 조언자</h1>
        <form action="/get_advice" method="post">
            <div class="form-group">
                <label for="level">현재 레벨 (1-8):</label>
                <input type="number" id="level" name="level" min="1" max="8" required>
            </div>
            <div class="form-group">
                <label for="attempts">남은 시도 횟수 (1-100):</label>
                <input type="number" id="attempts" name="attempts" min="1" max="100" required>
            </div>
            <button type="submit">🤔 최적의 선택은?</button>
        </form>
        
        {% if recommendation %}
        <div id="result-container" class="{{ recommendation|lower }}">
            추천 행동: {{ recommendation }}
        </div>
        {% endif %}
    </div>
</body>
</html>
